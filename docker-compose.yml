# docker-compose.yml — full Axion stack (Neo4j + API + frontend)
#
# Usage:
#   cp .env.example .env      # then fill in keys/secrets
#   docker compose up --build
#   → frontend  http://localhost:3000
#   → API docs  http://localhost:8000/docs
#   → Neo4j     bolt://localhost:7887 (browser http://localhost:7474)
#
# Values are read from the repo-root .env (see .env.example).
# NOTE: NEXT_PUBLIC_* frontend values are baked in at BUILD time; change them
# with `docker compose build web`.

name: axion

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: axion_neo4j
    ports:
      # Bind to loopback only: the graph DB must not be exposed on the LAN.
      # (Host port 7887 avoids Windows reserved-port conflicts.)
      - "127.0.0.1:7887:7687"   # Bolt protocol (what the driver uses)
      - "127.0.0.1:7474:7474"   # Neo4j Browser (local debugging)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    healthcheck:
      # Derive the password from NEO4J_AUTH. Do NOT add a dedicated NEO4J_*
      # env var for it: Neo4j parses every NEO4J_* variable as a config
      # setting and rejects unknown ones under strict validation.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axion_api
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Inside the compose network, reach Neo4j by service name + internal port.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AXION_API_KEY=${AXION_API_KEY:-}
      - TRIGGER_SECRET=${TRIGGER_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - SCHEDULER_INTERVAL_HOURS=${SCHEDULER_INTERVAL_HOURS:-6}
      - SCHEDULER_PAPERS_PER_RUN=${SCHEDULER_PAPERS_PER_RUN:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HF_HOME=/app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      # ChromaDB vectors + downloaded papers live on the host.
      - ./data:/app/data
      # Cache the sentence-transformers model across restarts.
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=4).status==200 else 1)\""]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./axion
      dockerfile: Dockerfile
      args:
        # Build-time inlining — the browser calls the API on the exposed port.
        # NOTE: never pass secrets as NEXT_PUBLIC_* build args: they are
        # embedded in the client bundle and readable by anyone.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: axion_web
    environment:
      # Server-side proxy target (inside the compose network) and the API key
      # it injects. Both stay on the server; neither reaches the browser.
      - AXION_API_URL=${AXION_API_URL:-http://api:8000}
      - AXION_API_KEY=${AXION_API_KEY:-}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  hf_cache:
